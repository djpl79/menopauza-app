version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: menopauza-postgres
    environment:
      POSTGRES_USER: menopauza
      POSTGRES_PASSWORD: menopauza123
      POSTGRES_DB: menopauza_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - menopauza-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: menopauza-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@menopauza.pl
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - menopauza-network

volumes:
  postgres_data:

networks:
  menopauza-network:
    driver: bridge
